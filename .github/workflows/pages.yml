# Pubblica l'app su GitHub Pages a ogni modifica del ramo main.
# La chiave API non è nel codice: viene letta dal segreto DRIVE_API_KEY del repository.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Inserisci la chiave API dal segreto del repository
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: |
          if [ -z "$DRIVE_API_KEY" ]; then
            echo "::error::Il segreto DRIVE_API_KEY è vuoto o non configurato nel repository."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const file = "src/environments/environment.ts";
            const src = fs.readFileSync(file, "utf8");
            const placeholder = "INSERISCI_QUI_LA_TUA_API_KEY";
            if (!src.includes(placeholder)) {
              console.error("::error::Segnaposto API key non trovato in " + file);
              process.exit(1);
            }
            fs.writeFileSync(file, src.replace(placeholder, () => process.env.DRIVE_API_KEY));
          '

      - name: Installa le dipendenze
        run: npm ci

      - name: Compila l'app
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/biblioteca-gdr/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
